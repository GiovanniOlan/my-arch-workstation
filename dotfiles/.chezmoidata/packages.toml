[packages.pacman]
common = [
  # Session plumbing
  "xdg-user-dirs",
  "xdg-desktop-portal",
  "xdg-desktop-portal-hyprland",
  "polkit",
  "polkit-gnome",
  "udisks2",
  "networkmanager",
  # Build toolchain, needed to bootstrap the AUR helper
  "base-devel",
  "git",
  "less",
  # Audio
  "pipewire",
  "pipewire-alsa",
  "pipewire-jack",
  "pipewire-pulse",
  "wireplumber",
  "pavucontrol",
  # Compositor and session
  "hyprland",
  "hypridle",
  "hyprlock",
  # Applications
  "kitty",
  "nautilus",
  "calcurse",
  "fuzzel",
  "playerctl",
  "tmux",
  "lazygit",
  "flatpak",
  "obsidian",
  "evince",
  "eog",
  "vlc",
  "vlc-plugins-all",
  "rofimoji",
  "wtype",
  "docker",
  "docker-compose",
  "emacs",
  "ripgrep",
  "fd",
  "chromium",
  "firefox",
  "telegram-desktop",
  "7zip",
  # Status bar and its modules
  "waybar",
  "python-gobject",
  "power-profiles-daemon",
  # Bluetooth
  "bluez",
  "bluez-utils",
  # Notifications
  "mako",
  "libnotify",
  # Clipboard
  "wl-clipboard",
  "cliphist",
  # Screenshots
  "grim",
  "slurp",
  "jq",
  # Fonts
  "noto-fonts",
  "noto-fonts-cjk",
  "noto-fonts-emoji",
  "ttf-caladea",
  "ttf-carlito",
  "ttf-jetbrains-mono-nerd",
  "ttf-liberation",
]

laptop = [
  "brightnessctl",
  "sof-firmware",
]

[packages.aur]
common = [
  "grimblast-git",          # screenshot wrapper used by the PRINT keybinds
  "overskride-bin",         # bluetooth client
  "visual-studio-code-bin",
  "google-chrome",
  "brave-bin",
  "nordvpn-bin",
  "handy-bin",               # speech-to-text, used by the SUPER+D keybind
]

[packages.flatpak]
common = [
  "org.localsend.localsend_app",
  "com.bitwarden.desktop",
]
